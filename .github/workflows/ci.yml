name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: migrations are in sync with models
        run: |
          export DATABASE_URL=sqlite:///./ci.db
          alembic upgrade head && alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend-postgres:
    # Same test-suite against a real PostgreSQL container (the dev default is SQLite).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: jobpilot, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: jobpilot_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobpilot" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: {run: {working-directory: backend}}
    env:
      TEST_DATABASE_URL: postgresql+psycopg://jobpilot:ci-only@localhost:5432/jobpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r requirements.txt
      - name: migrations apply to PostgreSQL and match the models
        run: |
          export DATABASE_URL="$TEST_DATABASE_URL"
          alembic upgrade head && alembic check
          alembic downgrade base && alembic upgrade head
      - run: pytest -q

  containers:
    # Builds both images and brings up the whole docker-compose stack, then smoke-tests it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: create .env from the example
        run: |
          cp .env.example .env
          sed -i 's/^SECRET_KEY=.*/SECRET_KEY=ci-secret-key-not-for-production-0123456789/' .env
      - name: build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: smoke test
        run: |
          set -e
          curl -fsS http://localhost:8000/health
          curl -fsS -o /dev/null -w "web /login -> %{http_code}\n" http://localhost:3000/login
          curl -fsS -X POST http://localhost:8000/api/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}'
          TOKEN=$(curl -fsS -X POST http://localhost:8000/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -fsS http://localhost:8000/api/dashboard -H "Authorization: Bearer $TOKEN"
          echo; docker compose ps
          docker compose logs scheduler | grep -q "scheduler started"
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: tear down
        if: always()
        run: docker compose down -v